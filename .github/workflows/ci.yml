name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Tests (Python 3.14)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run tests
        run: |
          python -m unittest discover -s tests -v

      - name: Run examples
        run: |
          python examples/botfarm_lead.py
          python examples/multi_agent_swarm.py
          python examples/memory_tiers.py
          python examples/dag_actions.py
          python examples/full_runtime.py
          python benchmarks/recall20.py

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Run benchmarks
        run: |
          python benchmarks/run_bench.py --all

  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build
        run: |
          python -m pip install --upgrade pip build

      - name: Build distribution
        run: |
          python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  packaging-contract:
    name: Packaging Contract (Python 3.14)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Audit static native contracts
        run: |
          python scripts/verify_packaging_contract.py --output /tmp/packaging-contract.json

      - name: Verify active Python 3.14 runtime
        run: |
          python scripts/verify_python314.py --json

      - name: Build source-portable artifact with SHA-256 manifest and SPDX SBOM
        run: |
          python scripts/build_portable_artifact.py --root . --output /tmp/noesis-portable.zip
          python scripts/verify_portable_artifact.py --artifact /tmp/noesis-portable.zip --output /tmp/portable-evidence.json

      - name: Verify Linux never claims Windows or macOS native evidence
        run: |
          for target in windows macos; do
            set +e
            python scripts/verify_native_artifact.py --target "$target" --artifact /tmp/noesis-portable.zip --output "/tmp/native-evidence-$target.json"
            code=$?
            set -e
            test "$code" -eq 2
            grep -q 'target_host_or_python_mismatch' "/tmp/native-evidence-$target.json"
          done

  lint:
    name: Lint (pyflakes)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pyflakes
        run: |
          python -m pip install pyflakes

      - name: Run pyflakes
        run: |
          pyflakes noesis_harness/ examples/ integrations/ benchmarks/