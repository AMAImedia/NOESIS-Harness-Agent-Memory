[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "noesis-harness-agent-memory"
version = "0.5.0"
description = "Local-first agent framework core: event store, four-tier memory, coordination (leases/signals/actions). Zero dependencies."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Ilya Bolotnikov", email = "djbionicl@amaimedia.com" }]
keywords = ["agents", "llm", "memory", "event-sourcing", "multi-agent", "local-first", "coordination"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/AMAImedia/NOESIS-Harness-Agent-Memory"
Repository = "https://github.com/AMAImedia/NOESIS-Harness-Agent-Memory"
Documentation = "https://github.com/AMAImedia/NOESIS-Harness-Agent-Memory/blob/main/docs/architecture.md"
Issues = "https://github.com/AMAImedia/NOESIS-Harness-Agent-Memory/issues"
Changelog = "https://github.com/AMAImedia/NOESIS-Harness-Agent-Memory/blob/main/CHANGELOG.md"

[project.scripts]
noesis-inspect = "noesis_harness.inspect_ui:main"

[tool.setuptools]
packages = ["noesis_harness"]

[tool.setuptools.package-data]
noesis_harness = ["py.typed"]

[tool.coverage.run]
source = ["noesis_harness"]
omit = ["*/tests/*", "*/examples/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
